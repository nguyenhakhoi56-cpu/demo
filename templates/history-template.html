<!-- History Structure Template -->
<div class="history-container">
    <!-- Left Column: Sticky Image or Banner -->
    <div class="history-left">
        <div class="img-box">
            <img src="" alt="">
        </div>
    </div>

    <!-- Right Column: Interactive Timeline -->
    <div class="history-right" id="timeline-container">
        <div class="history-line-bg"></div>
        <div class="history-line-active" id="active-line"></div>
        
        <div class="history-wrap">
            <!-- Year Group -->
            <div class="history-box">
                <span class="year">YYYY</span>
                <div class="history-item-wrap">
                    <!-- History Item -->
                    <div class="history-item">
                        <span class="month">MM</span>
                        <p class="txt">Content description goes here.</p>
                    </div>
                </div>
            </div>
            
            <!-- Additional Year Groups... -->
        </div>
    </div>
</div>
